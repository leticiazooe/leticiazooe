name: Atualizar arte do perfil

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch public contribution data
        env:
          GH_PROFILE_USER: leticiazooe
        run: python scripts/fetch_contributions.py
      - name: Render contribution heatmap and statistics
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
      - name: Render ASCII avatar from Leticia's GitHub profile photo
        run: |
          python scripts/fetch_avatar.py
          python scripts/make_ascii_svg.py
      - name: Commit generated graphics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualizar arte do perfil [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg leticia-ascii.svg"
